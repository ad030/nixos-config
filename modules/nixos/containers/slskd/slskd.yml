# anti leecher
groups:
  leechers:
    thresholds:
      files: 1
      directories: 1
    upload:
      priority: 999
      strategy: roundrobin
      slots: 1
      speed_limit: 50
  blacklisted:
    patterns:
      - ^u[0-9a-f]{12}$

# set up webhook for ntfy messages
integrations:
  webhooks:
    message_webhook:
      on:
        - PrivateMessageReceived
      call:
        url: https://ntfy.home.4384381.xyz/slskd-message
        headers:
          - name: Title
            value: "slskd: New message"
          - name: Priority
            value: "default"
        ignore_certificate_errors: true
